# Kubernetes service accounts, annotated for Workload Identity Federation for GKE (KSA -> GSA). The matching
# roles/iam.workloadIdentityUser bindings are created by infra/terraform/modules/gke (workload_identity_bindings).
# PROJECT_ID is replaced by the overlays.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signal-event-gateway
  annotations:
    iam.gke.io/gcp-service-account: sa-gke-signal-event-gateway@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: correlation-engine
  annotations:
    iam.gke.io/gcp-service-account: sa-gke-correlation-engine@PROJECT_ID.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dls-catalog-sync
  annotations:
    iam.gke.io/gcp-service-account: sa-gke-dls-catalog-sync@PROJECT_ID.iam.gserviceaccount.com
---
# The ledger anchor runs AS the ledger identity: only SA-LEDGER may sign with approval-token-signer and write the
# signed segment exports (docs/07 §8.1).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-anchor
  annotations:
    iam.gke.io/gcp-service-account: sa-mcp-ledger@PROJECT_ID.iam.gserviceaccount.com
