# Webhook verification secrets: Secret Manager -> Kubernetes Secret via External Secrets Operator (ESO), then env vars
# PM_AGENT_WEBHOOK_* on signal-event-gateway (src/pm_agent/event_gateway/secrets.py).
# The SecretStore authenticates AS the signal-event-gateway KSA (Workload Identity Federation for GKE ->
# sa-gke-signal-event-gateway), so the event-gateway GSA is the only identity with secretAccessor on these secrets
# (infra/terraform/modules/platform: local.webhook_secrets). Bootstrap versions hold PLACEHOLDER tokens; the app
# treats them as "not configured" and fails closed until real values are added as newer versions.
# Prerequisite: ESO installed in the cluster (deploy/k8s/README.md). PROJECT_ID / cluster are set by the overlays.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: event-gateway-secret-manager
spec:
  provider:
    gcpsm:
      projectID: PROJECT_ID
      auth:
        workloadIdentity:
          clusterLocation: us-central1
          clusterName: pm-agent-dev
          clusterProjectID: PROJECT_ID
          serviceAccountRef:
            name: signal-event-gateway
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: signal-event-gateway-webhooks
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: event-gateway-secret-manager
  target:
    name: signal-event-gateway-webhooks
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PM_AGENT_WEBHOOK_ADO_BASIC_USERNAME
      remoteRef:
        key: webhook-ado-basic-username
        version: latest
    - secretKey: PM_AGENT_WEBHOOK_ADO_BASIC_PASSWORD
      remoteRef:
        key: webhook-ado-basic-password
        version: latest
    - secretKey: PM_AGENT_WEBHOOK_ADO_SHARED_SECRET
      remoteRef:
        key: webhook-ado-shared-secret
        version: latest
    - secretKey: PM_AGENT_WEBHOOK_SERVICENOW_HMAC_SECRET
      remoteRef:
        key: webhook-servicenow-hmac-secret
        version: latest
    - secretKey: PM_AGENT_WEBHOOK_PAGERDUTY_SIGNING_SECRETS # comma-separated; old + new overlap during rotation
      remoteRef:
        key: webhook-pagerduty-signing-secrets
        version: latest
    - secretKey: PM_AGENT_WEBHOOK_MSGRAPH_CLIENT_STATE
      remoteRef:
        key: webhook-msgraph-client-state
        version: latest
    - secretKey: PM_AGENT_WEBHOOK_FIGMA_PASSCODE
      remoteRef:
        key: webhook-figma-passcode
        version: latest
