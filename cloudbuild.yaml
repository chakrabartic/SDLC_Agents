# Cloud Build CI/CD pipeline (docs/12 §4). Gates 1-6 block the build; deploy stages are placeholders until
# stage/prod projects exist (Q-10). Substitutions are set by the trigger (Terraform: infra/terraform/modules/ci).
substitutions:
  _ENV: dev
  _REGION: us-central1
  _AR_REPO: pm-agent                       # Artifact Registry repository
  _AGENT_RUNTIME_SA: "PLACEHOLDER:Q-10:deploy_service_account"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: install
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", "python -m venv .venv && .venv/bin/pip install -q -e '.[dev]'"]

  - id: gate-1-policy-lint            # forbidden APIs/patterns (GOOGLE_API_KEY, google.generativeai, BaseException…)
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python tools/policy_lint.py"]
    waitFor: [install]

  - id: gate-2-pylint
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m pylint src/pm_agent tools --fail-under=9.5"]
    waitFor: [install]

  - id: gate-3-mypy-strict
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m mypy"]
    waitFor: [install]

  - id: gate-4-unit-contract-component     # no network, no LLM (replay/fakes)
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m pytest -q"]
    waitFor: [install]

  - id: gate-5-groundedness-eval           # HARD GATE: uncited claims in approved/proposed outputs must be 0
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m pytest -q tests/component -k groundedness"]
    waitFor: [gate-4-unit-contract-component]

  - id: gate-6-safety-suite                # HARD GATE: 0 unauthorized writes, 0 accepted forged/replayed tokens
    name: python:3.13-slim
    entrypoint: bash
    args: ["-c", ".venv/bin/python -m pytest -q tests -k 'safety or token'"]
    waitFor: [gate-4-unit-contract-component]

  - id: build-images                       # one image per container component (deploy/Dockerfile, ARG COMPONENT)
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        # Container components = values of PM_AGENT_COMPONENT understood by `python -m pm_agent.serve`.
        # The three Agent Runtime apps (pm_agent.core_app / ingestion_app / executor_app) are deployed from source
        # by the Agent Platform deploy step, not as images (deploy/agent_runtime/README.md).
        for c in pm-workbench signal-event-gateway mcp-verifier mcp-ledger mcp-store mcp-correlation \
                 mcp-ado mcp-ado-write mcp-servicenow mcp-pagerduty mcp-msgraph mcp-msgraph-write \
                 mcp-figma mcp-figma-write mcp-kb mcp-kb-write svc-prototype-renderer dls-catalog-sync ledger-anchor; do
          docker build -f deploy/Dockerfile --build-arg COMPONENT=$$c \
            -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/$$c:$SHORT_SHA . || exit 1
        done
    waitFor: [gate-5-groundedness-eval, gate-6-safety-suite, gate-1-policy-lint, gate-2-pylint, gate-3-mypy-strict]

  # Deploy stages (stage/prod) are added once Q-10 is resolved: push images, apply Terraform (Agent Gateway
  # policies in dry-run first), deploy Agent Runtime revisions, run online evals, then require manual approval.
images: []
